name: Linux build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Initialize only required DPF submodules
        run: |
          git submodule update --init DPF
          git -C DPF submodule update --init dgl/src/pugl-upstream
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev libxinerama-dev libasound2-dev libjack-jackd2-dev ffmpeg
      - name: Verify checked-in artwork matches source PNG
        run: |
          python3 tools/embed-artwork.py
          git diff --exit-code -- ArtworkData.hpp
      - name: Test bounded audio loading
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=1' -ac 2 -c:a pcm_s16le codec.wav
          ffmpeg -hide_banner -loglevel error -i codec.wav -c:a flac codec.flac
          ffmpeg -hide_banner -loglevel error -i codec.wav -c:a libmp3lame codec.mp3
          g++ -std=gnu++17 -O2 -Wall -Wextra tests/audio_loader.cpp AudioFileLoader.cpp -o /tmp/drumcloud-audio-loader-test
          /tmp/drumcloud-audio-loader-test
      - name: Test automatic root and fine-tune detection
        run: |
          g++ -std=gnu++17 -O2 -Wall -Wextra tests/pitch_detector.cpp PitchDetector.cpp -I. -o /tmp/drumcloud-pitch-detector-test
          /tmp/drumcloud-pitch-detector-test
      - name: Test filtered stereo and ping-pong delay
        run: |
          g++ -std=gnu++17 -O2 -Wall -Wextra tests/filtered_delay.cpp FilteredStereoDelay.cpp -I. -o /tmp/drumcloud-delay-test
          /tmp/drumcloud-delay-test
      - name: Test polyphonic note ownership
        run: |
          g++ -std=gnu++17 -O2 -Wall -Wextra tests/polyphonic_notes.cpp -I. -o /tmp/drumcloud-polyphony-test
          /tmp/drumcloud-polyphony-test
      - name: Build CLAP and VST3
        run: |
          ./build.sh
          test -f bin/d_drumcloud.clap
          test -d bin/d_drumcloud.vst3
